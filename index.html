<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tabletop — Supabase</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<!-- Cropper.js CSS & JS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<style>
  :root {
    --bg: #1b1d22; --panel: #26282f; --panel-border: #383b44;
    --text: #e8e9ec; --text-dim: #9a9ea8; --accent: #6c8cff;
    --accent-text: #0b0d12; --danger: #ff6b6b; --ok: #6cff9e;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  .hidden { display: none !important; }
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
    overscroll-behavior: none; touch-action: none; }
  body { position: relative; }

  #topBar { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 30;
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--panel-border);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    transition: transform .2s ease; }
  #topBar.collapsed { transform: translateY(-100%); }
  #topBar h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; color: var(--text-dim); }

  #topBarToggle { position: fixed; top: env(safe-area-inset-top, 0px); left: 50%; transform: translateX(-50%);
    z-index: 31; background: var(--panel); border: 1px solid var(--panel-border); border-top: none;
    border-radius: 0 0 8px 8px; padding: 2px 14px; color: var(--text-dim); cursor: pointer; }
  #topBar.collapsed ~ #topBarToggle { top: 0; }

  #sideToolbar { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 30;
    background: var(--panel); border: 1px solid var(--panel-border); border-right: none;
    border-radius: 10px 0 0 10px; padding: 8px 6px; display: flex; flex-direction: column; gap: 6px;
    align-items: center; transition: transform .2s ease; max-height: 80vh; overflow-y: auto; }
  #sideToolbar.collapsed { transform: translateY(-50%) translateX(100%); }
  #sideToolbar button, #sideToolbar label.btn { width: 42px; height: 42px; padding: 0; justify-content: center; font-size: 18px; }
  #sideToolbar hr { width: 100%; border: none; border-top: 1px solid var(--panel-border); margin: 2px 0; }
  #sideToolbar .toolBtn.active { background: var(--accent); color: var(--accent-text); }

  #sideToolbarToggle { position: fixed; right: 0; top: calc(50% - 90px); z-index: 31;
    background: var(--panel); border: 1px solid var(--panel-border); border-right: none;
    border-radius: 8px 0 0 8px; padding: 10px 2px; color: var(--text-dim); cursor: pointer; }
  #sideToolbar.collapsed ~ #sideToolbarToggle { right: 0; }

  #connDot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); margin-right: auto; }
  #connDot.ok { background: var(--ok); }

  button, label.btn { background: var(--panel-border); color: var(--text); border: none; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button.primary, label.btn.primary { background: var(--accent); color: var(--accent-text); }
  button.danger { background: var(--danger); color: #fff; }
  input[type=file] { display: none; }

  #boardWrap { position: fixed; inset: 0; overflow: hidden; touch-action: none;
    background: linear-gradient(45deg, rgba(128,128,128,.08) 25%, transparent 25%) 0 0/20px 20px,
                linear-gradient(-45deg, rgba(128,128,128,.08) 25%, transparent 25%) 0 0/20px 20px; }
  #board { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; width: 1px; height: 1px; }
  
  /* Camada do Grid Infinito em CSS/SVG */
  #gridLayer { position: absolute; left: -20000px; top: -20000px; width: 40000px; height: 40000px; pointer-events: none; z-index: 50; display: none; }
  
  #mapPiecesLayer { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  body.map-editor-active #mapPiecesLayer { pointer-events: auto; }
  
  #tokensLayer { position: absolute; inset: 0; z-index: 10000; pointer-events: none; }
  #tokensLayer > * { pointer-events: auto; }

  #placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 14px; text-align: center; padding: 20px; z-index: 0; }
  
  .token { position: absolute; touch-action: none; cursor: grab; user-select: none; -webkit-user-drag: none; will-change: left, top; }
  .token.dragging { opacity: .85; }

  .mapPiece { position: absolute; touch-action: none; user-select: none; -webkit-user-drag: none; pointer-events: none; will-change: left, top; }
  body.map-editor-active .mapPiece { pointer-events: auto; cursor: grab; }
  .mapPiece.dragging { opacity: .85; }

  .pieceImg { position: absolute; inset: 0; background-size: contain; background-position: center; background-repeat: no-repeat; pointer-events: none; user-select: none; -webkit-user-drag: none; image-rendering: auto; }
  
  .resizeHandle { position: absolute; right: -6px; bottom: -6px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); touch-action: none;
    cursor: nwse-resize; display: none; }
  
  .rotateHandle { position: absolute; left: 50%; top: -22px; transform: translateX(-50%);
    width: 16px; height: 16px; border-radius: 50%; background: var(--ok); border: 2px solid var(--bg);
    touch-action: none; cursor: grab; display: none; }

  .selected .resizeHandle, .selected .rotateHandle { display: block; }
  .selected .pieceImg { outline: 2px dashed var(--accent); outline-offset: 4px; }

  #contextMenu { position: fixed; z-index: 60000; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 6px; display: none; min-width: 200px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  #contextMenu.open { display: block; }
  #contextMenu button { width: 100%; justify-content: flex-start; background: transparent; border-radius: 6px; margin: 1px 0; }
  #contextMenu button:hover { background: var(--panel-border); }
  #contextMenu hr { border: none; border-top: 1px solid var(--panel-border); margin: 6px 0; }
  #contextMenu .statesRow { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 2px; }
  #contextMenu .stateThumb { width: 36px; height: 36px; border-radius: 6px; background-size: contain;
    background-position: center; background-repeat: no-repeat; border: 2px solid var(--panel-border); cursor: pointer; }
  #contextMenu .stateThumb.active { border-color: var(--accent); }
  
  footer { position: fixed; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px); z-index: 20;
    padding: 4px 14px; font-size: 10px; color: var(--text-dim); background: rgba(38,40,47,.85);
    backdrop-filter: blur(4px); pointer-events: none; }

  #setupOverlay, #loginOverlay, #cropOverlay, #playersOverlay, #scenesOverlay, #gridOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex;
    align-items: center; justify-content: center; z-index: 100000; padding: 16px; }
  .hidden { display: none !important; }

  .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    padding: 20px; max-width: 480px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .card h2 { margin-top: 0; font-size: 16px; }
  .card p { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .card input[type="text"], .card input[type="password"], .card select { width: 100%; padding: 8px 10px; margin: 6px 0 12px; border-radius: 8px;
    border: 1px solid var(--panel-border); background: var(--bg); color: var(--text); font-size: 13px; }
  .card label { font-size: 12px; color: var(--text-dim); display: block; margin-top: 8px; }
  .card input[type="range"], .card input[type="color"] { width: 100%; margin: 6px 0 12px; accent-color: var(--accent); }
  
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button { flex: 1; justify-content: center; }
  #roleBadge { font-size: 12px; color: var(--text-dim); padding: 4px 8px; background: var(--panel-border); border-radius: 6px; }
  body.jogador .mestre-only { display: none !important; }

  #cropContainer { width: 100%; max-height: 350px; min-height: 200px; margin: 12px 0; background: #000;
    display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; }
  #cropImg { max-width: 100%; max-height: 350px; display: block; }

  .playerRow, .sceneRow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--panel-border); }
  .playerRow .name, .sceneRow .name { flex: 1; font-size: 13px; }
  .playerRow .roleTag { font-size: 11px; color: var(--text-dim); }
  .sceneRow .thumb { width: 48px; height: 36px; border-radius: 6px; background-size: cover; background-position: center;
    background-color: var(--bg); flex-shrink: 0; }
  .sceneRow .activeTag { font-size: 11px; color: var(--accent); }
</style>
</head>
<body>

  <!-- Conexão Supabase -->
  <div id="setupOverlay" class="hidden">
    <div class="card">
      <h2>Conectar ao Supabase</h2>
      <p>Cole o <strong>Project URL</strong> e a <strong>anon public key</strong> do seu projeto.</p>
      <label>Project URL</label>
      <input id="inpUrl" placeholder="https://xxxxx.supabase.co">
      <label>Anon public key</label>
      <input id="inpKey" placeholder="eyJhbGciOi...">
      <div id="setupError" style="color:var(--danger); font-size:12px; margin-bottom:8px;"></div>
      <button class="primary" id="btnConnect" style="width:100%">Conectar</button>
    </div>
  </div>

  <!-- Login / Cadastro -->
  <div id="loginOverlay" class="hidden">
    <div class="card">
      <h2>Entrar na mesa</h2>
      <p>Escolha um usuário e uma senha.</p>
      <label>Usuário</label>
      <input id="inpUsername" placeholder="seu-nome" autocomplete="username">
      <label>Senha</label>
      <input id="inpPassword" type="password" placeholder="••••••••" autocomplete="current-password">
      <div id="loginError" style="color:var(--danger); font-size:12px; margin-bottom:8px;"></div>
      <div class="row">
        <button class="primary" id="btnLogin">Entrar</button>
        <button id="btnSignup">Criar conta</button>
      </div>
    </div>
  </div>

  <!-- Modal de Recorte (Cropper) -->
  <div id="cropOverlay" class="hidden">
    <div class="card">
      <h2>Recortar Imagem</h2>
      <p>Ajuste o retângulo de seleção para remover bordas vazias.</p>
      <div id="cropContainer">
        <img id="cropImg" src="">
      </div>
      <div class="row">
        <button
